name: JS tests
on: [push, pull_request]
jobs:
    js-linter:
        name: JS linter
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-versions: [ '16', '20' ]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-versions }}
            - run: npm install
            - name: Lint
              run: npm run lint
